name: Bike Sharing CICD Pipeline

on:
  schedule:
  - cron : '*/15 * * * *'
  workflow_dispatch: # Allow manual trigger of the workflow

jobs:
  run-python:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
         python-version: '3.10'

      - name: Install dependencies
        run:  |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Fecth Station --> dim station
        env : 
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run : python scrape_station_info.py

      - name: Run Fetch Station status
        env : 
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scrape_station_status.py

      - name: Generate Bike Station Map 
        env : 
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python generate_latest_map.py

      - name : Commit and push latest bike availability map
        uses : stefanzweifel/git-auto-commit-action@v5
        with: 
          commit_message: "Update latest bike availability map"
          file_pattern: "latest_bike_availability_map.html map.geojson"
          branch: main

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy_to_pages
        uses: actions/deploy-pages@v4
        
  
