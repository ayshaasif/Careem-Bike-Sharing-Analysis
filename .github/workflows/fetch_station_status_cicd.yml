name: Bike Sharing CICD Pipeline

on:
  schedule:
  - cron : '*/15 * * * *'

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
       uses: actions/checkout@v4

      - name: Set up Python
       uses: actions/setup-python@v5
       with:
         python-version: '3.10'

      - name: Install dependencies
       run:  |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Fecth Station --> dim station
        run : python scrape_station_info.py

      - name: Run Fetch Station status
        run: python scarpe_2.py
        
  
